plugins { id 'com.android.application' }
android {
    namespace 'ru.blanki.mobile'
    compileSdk 36
    defaultConfig {
        applicationId 'ru.blanki.mobile'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0-preview1'
        ndk { abiFilters 'arm64-v8a' }
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17; coreLibraryDesugaringEnabled true }
    packaging { jniLibs { useLegacyPackaging false } }
    testOptions { unitTests.returnDefaultValues = true }
}
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'androidx.core:core:1.16.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.1'
    implementation 'org.opencv:opencv:4.12.0'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.23.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
